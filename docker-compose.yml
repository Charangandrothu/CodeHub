version: '3.8'

services:
  api:
    build: ./server
    container_name: codehubx-api
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codehubx-redis
    restart: unless-stopped
